name: next-ride

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextride}
      POSTGRES_DB: ${POSTGRES_DB:-nextride}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Expuesto solo en localhost para poder inspeccionar con psql/DBeaver.
      # Cambia POSTGRES_HOST_PORT si ya tienes un Postgres en el 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextride} -d ${POSTGRES_DB:-nextride}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nextride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextride}
      POSTGRES_DB: ${POSTGRES_DB:-nextride}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@next-ride.dev}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changeme123}
      BOOTSTRAP_SCRAPER_API_KEY: ${BOOTSTRAP_SCRAPER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      ANTHROPIC_ENABLE_FALLBACKS: ${ANTHROPIC_ENABLE_FALLBACKS:-true}
      RANKING_MAX_OFFERS: ${RANKING_MAX_OFFERS:-40}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
