server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # `^~` y no un prefijo a secas: sin él, la regex de assets de más abajo le
    # gana a cualquier prefijo y una respuesta del backend que acabara en `.json`
    # o `.svg` se serviría desde el disco del frontend.
    #
    # El frontend habla con el backend por el mismo origen: no hace falta CORS.
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger UI del backend, accesible desde el mismo host.
    location ^~ /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location ^~ /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # El service worker no puede quedarse congelado: la regla de assets de abajo
    # casa con `/sw.js`, y con 30 días de `immutable` quien ya tenga la app
    # instalada se quedaría clavado en la versión vieja durante un mes, sin
    # ninguna forma de enterarse.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # El shell nombra los assets con hash: si se congela, la app apunta a
    # ficheros que el despliegue siguiente ya ha borrado.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El manifest cambia de vez en cuando (iconos, nombre) y no lleva hash.
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo de aquí lleva hash en el nombre o `.vN` a mano (los iconos), así
    # que un mes de caché inmutable es correcto.
    # `max-age` va dentro del `add_header` y no en un `expires` aparte: los dos
    # juntos emiten dos cabeceras `Cache-Control` distintas. Aquí coincidían, así
    # que no rompía nada, pero deja el caso listo para que algún día no coincidan.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, immutable, max-age=2592000";
        try_files $uri =404;
    }
}
